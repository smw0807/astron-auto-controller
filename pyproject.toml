[project]
name = "astron-auto-controller"
version = "0.1.0"
description = "BlueStacks Astron auto-hunt controller: scan instances, build flows, run per-instance automation."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "psutil>=5.9",
    "pillow>=10.0",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
aac = "aac.__main__:main"
aac-scan = "aac.tools.scan:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aac"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["E501"]
